name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests (no network, no API cost)
        run: pytest -q
      - name: Deterministic retrieval eval
        run: python -m repolens.evaluation --embedder hashing --output eval/results-hashing.json
      - name: Generative eval replay (recorded Gemini answers, no API calls)
        run: python -m repolens.rag_evaluation --mode replay --embedder hashing --recording eval/recordings/gemini-3.5-flash-lite.json --output eval/results-gemini-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/results-hashing.json
            eval/results-gemini-replay.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t repolens-ai .
