[project]
name = "repolens-ai"
version = "0.1.0"
description = "Semantic search and grounded Q&A over public GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repolens = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eval/fixture_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads the real sentence-transformers model (needs network or cached model)"]
addopts = "-m 'not slow'"
