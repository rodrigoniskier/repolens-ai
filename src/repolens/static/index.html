<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoLens AI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#59636e; --accent:#0b5fff; --border:#d0d7de; --warn:#9a6700; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#9198a1; --accent:#4c8dff; --border:#30363d; --warn:#d29922; --ok:#3fb950; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 1rem; }
  h1 { margin: .5rem 0 0; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 0 0 1rem; }
  section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  h2 { font-size:1.05rem; margin:0 0 .6rem; }
  form { display:flex; gap:.5rem; flex-wrap:wrap; }
  input, select, button { font:inherit; padding:.55rem .7rem; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--fg); }
  input[type=text] { flex:1 1 260px; min-width:0; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .msg { margin:.7rem 0 0; color:var(--muted); }
  .msg.err { color:#cf222e; } .msg.warn { color:var(--warn); } .msg.ok { color:var(--ok); }
  .answer { white-space:pre-wrap; border-left:4px solid var(--ok); padding-left:.8rem; margin:.7rem 0; }
  article { border:1px solid var(--border); border-radius:6px; margin-top:.7rem; overflow:hidden; }
  article header { padding:.4rem .7rem; background:var(--bg); display:flex; flex-wrap:wrap; gap:.3rem .8rem; justify-content:space-between; font-size:.9rem; }
  article header a { color:var(--accent); word-break:break-all; }
  article header .cited { color:var(--ok); font-weight:600; }
  pre { margin:0; padding:.7rem; overflow-x:auto; font:13px/1.45 ui-monospace, monospace; }
  .meta { color:var(--muted); }
  ul { padding-left:1.2rem; margin:.4rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>RepoLens AI</h1>
  <p class="sub">Index a public GitHub repository, then ask questions. Every result cites file, lines and commit.</p>

  <section aria-labelledby="h-ingest">
    <h2 id="h-ingest">1. Index a repository</h2>
    <form id="ingest-form">
      <label for="repo-url" hidden>Repository URL</label>
      <input id="repo-url" type="text" required maxlength="200" placeholder="https://github.com/owner/repo" inputmode="url">
      <button type="submit">Index</button>
    </form>
    <p id="ingest-msg" class="msg" role="status"></p>
    <ul id="repos"></ul>
  </section>

  <section aria-labelledby="h-query">
    <h2 id="h-query">2. Ask a question</h2>
    <form id="query-form">
      <label for="question" hidden>Question</label>
      <input id="question" type="text" required minlength="3" maxlength="1000" placeholder="Where is the request retry logic implemented?">
      <label for="repo-filter" hidden>Repository filter</label>
      <select id="repo-filter"><option value="">All repositories</option></select>
      <button type="submit">Search</button>
    </form>
    <p id="query-msg" class="msg" role="status"></p>
    <div id="answer"></div>
    <div id="sources"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  node.append(...children);
  return node;
}

function setMsg(node, text, cls = "") { node.textContent = text; node.className = "msg " + cls; }

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg).join("; ") : data.detail;
    throw new Error(detail || `HTTP ${res.status}`);
  }
  return data;
}

async function loadRepos() {
  const repos = await api("/repos");
  const list = $("repos"), filter = $("repo-filter");
  list.replaceChildren(...repos.map((r) => el("li", {}, `${r.repo} @ ${r.commit.slice(0, 12)} (${r.chunks} chunks)`)));
  const current = filter.value;
  filter.replaceChildren(el("option", { value: "", textContent: "All repositories" }),
    ...repos.map((r) => el("option", { value: r.repo, textContent: r.repo })));
  filter.value = repos.some((r) => r.repo === current) ? current : "";
}

$("ingest-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button"), msg = $("ingest-msg");
  btn.disabled = true;
  setMsg(msg, "Cloning and indexing... this can take a while on the first run (model download).");
  try {
    const r = await api("/ingest", { repo_url: $("repo-url").value.trim() });
    const skipped = Object.entries(r.skipped).map(([k, v]) => `${k}: ${v}`).join(", ") || "none";
    setMsg(msg, `Indexed ${r.repo} @ ${r.commit.slice(0, 12)}: ${r.files_indexed} files, ${r.chunks_indexed} chunks. Skipped: ${skipped}.` +
      (r.truncated ? " Limits reached: index is partial." : ""), r.truncated ? "warn" : "ok");
    await loadRepos();
  } catch (err) { setMsg(msg, err.message, "err"); }
  btn.disabled = false;
});

$("query-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button"), msg = $("query-msg");
  btn.disabled = true;
  setMsg(msg, "Searching...");
  $("answer").replaceChildren(); $("sources").replaceChildren();
  try {
    const r = await api("/query", { question: $("question").value.trim(), repo: $("repo-filter").value || null });
    setMsg(msg, r.message, r.status === "insufficient_evidence" ? "warn" : r.status === "answered" ? "ok" : "");
    if (r.answer) $("answer").append(el("div", { className: "answer", textContent: r.answer }));
    $("sources").replaceChildren(...r.sources.map((s) =>
      el("article", {},
        el("header", {},
          el("a", { href: s.url, target: "_blank", rel: "noopener noreferrer", textContent: `[${s.n}] ${s.repo}/${s.path}:${s.start_line}-${s.end_line}` }),
          el("span", { className: "meta", textContent: `commit ${s.commit.slice(0, 12)} · score ${s.score.toFixed(2)}` }),
          ...(s.cited ? [el("span", { className: "cited", textContent: "cited in answer" })] : [])),
        el("pre", { textContent: s.text }))));
  } catch (err) { setMsg(msg, err.message, "err"); }
  btn.disabled = false;
});

loadRepos().catch(() => {});
</script>
</body>
</html>
